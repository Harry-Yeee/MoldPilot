services:
  postgres:
    image: postgres:16
    container_name: moldpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moldpilot
      POSTGRES_USER: moldpilot
      POSTGRES_PASSWORD: moldpilot
    ports:
      - "5432:5432"
    volumes:
      - moldpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moldpilot -d moldpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moldpilot-postgres-data:
